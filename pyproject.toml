[project]
name = "jira-compliance-scanner"
version = "0.1.0"
description = "Scan PRs for Jira ticket compliance across a GitHub org"
requires-python = ">=3.11"
dependencies = ["rich>=13.0"]

[project.scripts]
jira-scan = "run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = [
    "run.py",
    "fetch_prs.py",
    "analyze_jira.py",
    "report.py",
    "classifiers.py",
    "gh_client.py",
]
